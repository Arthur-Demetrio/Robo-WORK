name: Corridor staging geometry
on:
  push:
    branches:
      - feature/corredor-alinhamento-20261019
  workflow_dispatch:

jobs:
  geometry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile geometry and tests
        run: python -m compileall -q scripts/geometry_corridor_geometry.py tests/test_corridor_geometry.py
      - name: Test corridor geometry without ROS
        run: python -m unittest discover -s tests -p 'test_corridor_geometry.py' -v
